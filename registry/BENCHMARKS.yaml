version: "1.0"
phase: PF-1
authority: benchmarks/README.md
purpose: >
  Canonical benchmark registration index. Benchmark-specific intent lives here
  and under benchmarks/BM-*/ — never in foundation core policies or global memory.

policy:
  no_invented_benchmarks: true
  registration_before_execution: true
  contract_immutability_when_frozen: true
  benchmark_score_before_execution_forbidden: true
  manual_skill_routing_forbidden: true
  global_memory_promotion_forbidden: true
  license_bypass_forbidden: true

lifecycle_statuses:
  - DRAFT
  - INPUT_REQUIRED
  - REGISTERED
  - FROZEN
  - EXECUTION_STARTED
  - COMPLETED
  - INVALIDATED

benchmarks: []

# FROZEN lock record schema (populated when a benchmark is frozen — not before operator input):
# benchmarks:
#   - benchmark_id: BM-001
#     contract_version: "1.0"
#     status: FROZEN
#     registration_path: benchmarks/BM-001/REGISTRATION.yaml
#     frozen_contract_sha256: "<sha256 — independent anchor>"
#     frozen_source_commit_sha: "<git commit containing frozen registration artifacts>"
#     frozen_at: "<iso8601 timestamp>"
#     versions:
#       - contract_version: "1.0"
#         parent_version: null
#         frozen_contract_sha256: "<sha256>"
#         frozen_source_commit_sha: "<git commit sha>"
#         revision_reason: "initial freeze"
