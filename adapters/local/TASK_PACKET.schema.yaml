version: "1.1"
schema: acos_local_task_packet
description: >
  Bounded task packet for local/open-source models without native Agent Skills.
  Routing fields are INPUT from external caller or future Phase F — not adapter-generated.

task_packet:
  acos_version: "1.2"
  adapter_id: ADAPTER-LOCAL-01

  canonical_refs:
    - ACOS_FINAL_CANONICAL_v1.2.md
    - AGENTS.md
    core_policies: []  # e.g. core/WORKFLOW.md when relevant
    registries:
      - registry/SKILLS.yaml
      - registry/TOOLS.yaml

  task:
    normalized_scope: ""
    classification: ""  # INPUT from caller/router — adapter must not derive

  routing:
    source: external_caller  # external_caller | phase_f_router
    activated_skill_ids: []  # REQUIRED input — adapter loads only these IDs
    routing_evidence_ref: null
    status: ok  # ok | routing_required | insufficient_routing_input

  activated_skills:
    # Resolved L2 paths — populated from routing.activated_skill_ids after registry validation
    - skill_id: ""
      skill_path: ""
      load_level: L2

  allowed_tools:
    - family: browser
      status: UNKNOWN
    - family: blender
      status: RESTRICTED
    - family: git
      status: UNKNOWN
    - family: shell
      status: UNKNOWN
    - family: filesystem
      status: UNKNOWN

  output_contract:
    deliverables: []
    handoff_schema: ""
    evidence_required: []

  stage:
    id: ""
    of: ""
    prior_stage_evidence_ref: null

notes:
  - activated_skill_ids are caller/router INPUT — adapter must not invent them
  - If activated_skill_ids empty when routing required → routing_required
  - Packet must stay bounded — no full skill library embed
  - Validate outputs externally between stages
