summary: >
  BM-002 run bm002-run-7c81df8639db recorded APPROVED / PASS 91.4, but critics never
  inspected rendered browser output. Visual and 3D dimension scores were produced by the
  same producer execution pipeline via static source-code heuristics. Scene-state and
