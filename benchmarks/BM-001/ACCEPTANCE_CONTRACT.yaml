benchmark_id: BM-001
contract_version: "1.1"
status: REGISTERED

scoring_note: >
  Benchmark score != ACOS Quality Gate status. ACOS certified Quality Gate remains
  authoritative. Hard rejects cannot be averaged away. Benchmark criteria may add
  measurability but must not bypass ACOS hard-reject rules or evidence requirements.

dimensions:
  functional:
    applicable: true
    weight: 15
    minimum_score: null
    hard_fail_conditions:
      - not_a_functional_web_experience
      - obvious_layout_breakage
      - broken_navigation_or_interaction
      - obvious_console_runtime_errors
    evidence_required:
      - E-001
      - E-002
      - E-005
      - E-006
    evaluator_type: human_and_machine
  visual:
    applicable: true
    weight: 20
    minimum_score: null
    hard_fail_conditions:
      - placeholder_quality_visual_assets
      - incoherent_visual_system
    evidence_required:
      - E-001
      - E-003
    evaluator_type: human_and_machine
  creative:
    applicable: true
    weight: 20
    minimum_score: null
    hard_fail_conditions:
      - no_intentional_creative_concept
      - generic_ai_generated_aesthetic
      - imitates_recognizable_brand
      - copies_existing_website
    evidence_required:
      - E-001
      - E-003
    evaluator_type: human
  responsive:
    applicable: true
    weight: 15
    minimum_score: null
    hard_fail_conditions:
      - catastrophic_breakage_at_required_viewports
      - desktop_only_designed_experience
    evidence_required:
