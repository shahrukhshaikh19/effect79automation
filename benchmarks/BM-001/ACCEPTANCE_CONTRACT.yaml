  performance:
    applicable: true
    weight: 10
    minimum_score: null
    hard_fail_conditions:
      - unjustified_severe_performance_degradation
    evidence_required:
      - E-009
    evaluator_type: machine
  accessibility:
    applicable: true
    weight: 5
    minimum_score: null
    hard_fail_conditions:
      - reduced_motion_not_considered_where_applicable
    evidence_required:
      - E-008
    evaluator_type: machine
  engineering:
    applicable: true
    weight: 10
    minimum_score: null
    hard_fail_conditions:
      - prototype_quality_shortcuts_in_final_acceptance
      - insufficient_evidence_for_quality_gate
    evidence_required:
      - E-005
      - E-006
      - E-010
    evaluator_type: machine
  reference_fidelity:
    applicable: false
    weight: 0
    minimum_score: null
    hard_fail_conditions: []
    evidence_required: []
    evaluator_type: human
    not_applicable_reason: no_reference_design_supplied
  three_d_quality:
    applicability: conditional
    default_state: NOT_APPLICABLE
    applicable: false
    weight: 0
    weight_when_applicable: 10
    applicable_when: meaningful_3d_used_in_deliverable
    activation_criteria:
      meaningful_3d_used_in_deliverable:
        definition: >
          Deliverable includes material 3D content (WebGL, Three.js, shaders, or Blender-sourced
          assets) that meaningfully contributes to the experience — not decorative CSS-only
          pseudo-3D, unused assets, or 3D forced without creative justification.
        determination: post_execution_evidence_and_routing_provenance_review
        routing: normal_acos_routing_only_no_manual_skill_activation
    minimum_score: null
    hard_fail_conditions:
      - forced_unjustified_3d
      - poor_3d_quality_when_meaningful_3d_used
    evidence_required_when_applicable:
      - E-011
    evidence_required: []
    evaluator_type: human
    evaluation_via_routing:
      critic_skills:
        - acos-3d-critic
      quality_gate: required_when_applicable
    not_applicable_when: no_meaningful_3d_in_deliverable
    not_applicable_reason: three_d_optional_excluded_from_scoring_when_not_used
  motion_quality:
    applicable: true
    weight: 5
    minimum_score: null
    hard_fail_conditions:
      - meaningless_decorative_animation
    evidence_required:
      - E-007
    evaluator_type: human

hard_failures:
  - copies_existing_website
  - recreates_supplied_commercial_design
  - imitates_recognizable_brand
  - generic_saas_landing_template
  - predictable_gradient_heavy_ai_aesthetics
  - arbitrary_glassmorphism
  - excessive_glow_without_purpose
  - random_floating_cards
  - meaningless_decorative_animation
  - forced_unjustified_3d
  - poor_3d_quality_when_meaningful_3d_used
  - usability_sacrificed_for_effects
  - unjustified_performance_sacrifice
  - desktop_only_designed_experience
  - placeholder_quality_visual_assets
  - not_a_functional_web_experience
  - obvious_layout_breakage
  - obvious_console_runtime_errors
  - broken_navigation_or_interaction
  - benchmark_aesthetic_cross_system_memory_promotion_forbidden

weight_normalization:
  rule: frozen_conditional_dimension_profiles
  enforced: true
  post_execution_weight_mutation: forbidden
  conditional_dimensions:
    - three_d_quality
  default_profile: no_meaningful_3d
  selection_rule: >
    Profile selected at scoring from deliverable evidence only. If meaningful 3D is absent,
    use no_meaningful_3d. If meaningful 3D is present, use meaningful_3d_used. Weights are
    fixed at contract freeze — never adjusted after execution results are known.
  profiles:
    no_meaningful_3d:
      condition: no_meaningful_3d_in_deliverable
      three_d_quality_state: NOT_APPLICABLE
      dimensions:
        functional: 15
        visual: 20
        creative: 20
        responsive: 15
        performance: 10
        accessibility: 5
        engineering: 10
        motion_quality: 5
      sum: 100
    meaningful_3d_used:
      condition: meaningful_3d_used_in_deliverable
      three_d_quality_state: APPLICABLE
      dimensions:
        functional: 13.5
        visual: 18
        creative: 18
        responsive: 13.5
        performance: 9
        accessibility: 4.5
        engineering: 9
        motion_quality: 4.5
        three_d_quality: 10
      sum: 100
      base_pool_redistribution: proportional_90_percent_of_default_profile_weights

revision:
  version: "1.1"
  parent_version: "1.0"
  reason: conditional_3d_quality_evaluation_and_frozen_weight_profiles
