$schema: "https://json-schema.org/draft/2020-12/schema"
title: ACOS Blender MCP Evidence Manifest
description: >
  Evidence metadata from Blender MCP operations. MCP does not claim visual approval.
type: object
required:
  - run_id
  - operation
properties:
  run_id:
    type: string
  timestamp:
    type: string
    format: date-time
  blend_file:
    type: string
  scene:
    type: string
  operation:
    type: string
  objects_affected:
    type: array
    items: { type: string }
  before_state:
    type: object
  after_state:
    type: object
  render_outputs:
    type: array
    items: { type: string }
  export_outputs:
    type: array
    items: { type: string }
  warnings:
    type: array
    items: { type: string }
  errors:
    type: array
    items: { type: string }
  tool_version:
    type: string
  blender_version:
    type: string
  visual_quality_approved:
    type: boolean
    const: false
