version: "1.0"
tool_id: TOOL-BLENDER-01
authority: ACOS_FINAL_CANONICAL_v1.2.md

upstream:
  canonical_url: https://github.com/MCPBlender/blender-mcp
  resolved_repo: https://github.com/ahujasid/blender-mcp
  commit_sha: "5866814479b4e2ca674d8d44969a9a2a78fdc8bb"
  package_version: "1.9.1"
  license: MIT
  retrieval_date: "2026-09-04"
  inspection_method: shallow_clone_and_source_review

runtime_requirements:
  python: ">=3.10"
  blender: ">=3.0 (per upstream README; 4.x recommended)"
  mcp_server: "uvx blender-mcp or pip install blender-mcp==1.9.1"
  blender_addon: bundled in upstream package (install via blender-mcp install-addon)

startup:
  mcp_server_entry: blender_mcp.server:main
  default_host: localhost
  default_port: 9876
  connection: TCP socket from MCP server to Blender addon

network_behavior:
  localhost_socket: yes
  external_asset_apis: yes
  telemetry_endpoint: yes
  notes: Poly Haven, Sketchfab, Hyper3D, Hunyuan integrations may call external APIs

filesystem_behavior:
  temp_screenshots: yes
  blend_save_open: via execute_blender_code / bpy operators
  export_paths: via Blender operators

subprocess_behavior:
  mcp_server_process: yes
  blender_executable: external — not bundled

inspected_files:
  - src/blender_mcp/server.py
  - src/blender_mcp/safe_mode.py
  - src/blender_mcp/addon_manager.py
  - addon.py
  - pyproject.toml

drift_check:
  status: no_material_drift
  notes: MCPBlender/blender-mcp redirects to ahujasid/blender-mcp; matches registry/SKILLS.yaml
