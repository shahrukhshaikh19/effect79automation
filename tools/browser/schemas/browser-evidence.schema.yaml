$schema: "https://json-schema.org/draft/2020-12/schema"
title: ACOS Browser Evidence Manifest
description: >
  Machine-readable browser evidence from Playwright capture.
  A screenshot does NOT imply visual quality approval.
  requested_device_scale_factor and effective_device_scale_factor must match for dpr_integrity.
type: object
required:
  - run_id
  - timestamp
  - target
  - captures
  - console_log_json
properties:
  run_id:
    type: string
  timestamp:
    type: string
    format: date-time
  target:
    type: string
  browser:
    type: string
  browser_version:
    type: string
  page_state:
    type: string
    enum: [loaded, error, timeout, blocked]
  reduced_motion:
    type: boolean
  readiness_condition:
    type: string
  duration_ms:
    type: integer
  runtime_healthy:
    type: boolean
  dpr_integrity:
    type: boolean
    description: True when all captures have matching requested vs effective DPR
  visual_quality_approved:
    type: boolean
    const: false
  console_log_json:
    type: string
    description: Relative path to console_log.json artifact
  captures:
    type: array
    items:
      type: object
      required:
        - viewport
        - capture_type
        - screenshot_path
        - browser
        - browser_version
      properties:
        viewport:
          type: object
          required: [name, width, height, requested_device_scale_factor, effective_device_scale_factor, dpr_integrity]
          properties:
            name: { type: string }
            width: { type: integer }
            height: { type: integer }
            requested_device_scale_factor: { type: number }
            effective_device_scale_factor: { type: number }
            dpr_integrity: { type: boolean }
        capture_type:
          type: string
          enum: [viewport, full_page, element, region]
        selector:
          type: string
        screenshot_path:
          type: string
        browser:
          type: string
        browser_version:
          type: string
        reduced_motion:
          type: boolean
        readiness_condition:
          type: string
        console_errors:
          type: array
          items: { type: string }
        page_errors:
          type: array
          items: { type: string }
        network_failures:
          type: array
          items: { type: string }
  notes:
    type: string
