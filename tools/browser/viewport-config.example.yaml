# Example viewport matrix — copy and customize per project.
# ACOS does not hardcode a single universal design viewport.

target: fixtures/blank.html

readiness:
  wait_until: networkidle
  timeout_ms: 15000
  animation_settle_ms: 250

reduced_motion: false

viewports:
  - name: desktop
    width: 1440
    height: 900
    device_scale_factor: 1
  - name: tablet
    width: 834
    height: 1194
    device_scale_factor: 2
  - name: mobile
    width: 390
    height: 844
    device_scale_factor: 3

capture:
  full_page: true
  types:
    - viewport
    - full_page
