# Example viewport matrix — copy and customize per project.

target: fixtures/blank.html

readiness:
  wait_until: networkidle
  timeout_ms: 15000
  animation_settle_ms: 250

reduced_motion: false

element_capture:
  selector: "#health-root"

viewports:
  - name: desktop-dpr1
    width: 1440
    height: 900
    device_scale_factor: 1
  - name: mobile-dpr3
    width: 390
    height: 844
    device_scale_factor: 3

capture:
  full_page: true
  types:
    - viewport
    - full_page
    - element
